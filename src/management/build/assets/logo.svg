<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="waveV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="#0F172A" stroke="#334155" stroke-width="5"/>
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.9"/>

  <!-- aura -->
  <circle cx="256" cy="272" r="175" fill="url(#aura)"/>

  <!-- sound waves (call energy) -->
  <path d="M 88 208 Q 58 272 88 336" stroke="url(#waveC)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M 66 188 Q 26 272 66 356" stroke="url(#waveV)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 424 208 Q 454 272 424 336" stroke="url(#waveC)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M 446 188 Q 486 272 446 356" stroke="url(#waveV)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- antenna -->
  <line x1="256" y1="112" x2="256" y2="170" stroke="#22D3EE" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="96" r="19" fill="#FBBF24" filter="url(#glow)"/>
  <circle cx="256" cy="96" r="7" fill="#FFFFFF" opacity="0.9"/>

  <!-- robot head -->
  <rect x="166" y="156" width="180" height="172" rx="58" fill="url(#headGrad)" filter="url(#glow)"/>
  <rect x="172" y="162" width="168" height="160" rx="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

  <!-- eyes -->
  <circle cx="213" cy="231" r="20" fill="#FFFFFF" filter="url(#softGlow)"/>
  <circle cx="299" cy="231" r="20" fill="#FFFFFF" filter="url(#softGlow)"/>
  <ellipse cx="213" cy="231" rx="9" ry="13" fill="#0B1220"/>
  <ellipse cx="299" cy="231" rx="9" ry="13" fill="#0B1220"/>
  <circle cx="299" cy="225" r="3" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="213" cy="225" r="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- smile -->
  <path d="M 224 264 Q 256 288 288 264" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- ear lights -->
  <circle cx="146" cy="250" r="9" fill="#22D3EE" filter="url(#softGlow)"/>
  <circle cx="366" cy="250" r="9" fill="#22D3EE" filter="url(#softGlow)"/>
  <circle cx="146" cy="250" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="366" cy="250" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>